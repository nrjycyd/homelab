# ====================================================================
# 二进制更新清单（manifest + 双 Releases 方案）
#
# release_repo : 本仓库 owner/repo，用于存放镜像 Releases；
#                留空则自动使用 GitHub Actions 的 GITHUB_REPOSITORY
#
# 双 release 结构：
#   pkgs   - 最新二进制（manifest.json 引用此 release，标记为 Latest）
#   backup - 次新备份，随每次更新自动生成，回滚用
#
# asset 命名规则：{name}-{上游原始文件名}
#   - 原名开头若与 name 的某个前缀（不区分大小写、逐段缩短）匹配且后跟分隔符/结尾，
#     则剥掉该前缀及分隔符，如 sing-box-releases + sing-box-1.14.0-... -> sing-box-releases-1.14.0-...
#   - 清理按 {name}- 最长前缀归属，整组替换
#
# 每个 binaries 条目字段：
#   name   : 程序名，manifest key 与 asset 命名空间前缀
#   repo   : 上游仓库 "owner/repo"
#   verify : 完整性校验方式（默认 none）
#              none      - 仅 sha256
#              checksums - 校验上游 checksums.txt / SHA256SUMS
#              minisig   - 校验上游 .minisig 签名（需 Secret: MINISIGN_PUBKEY）
#   assets : 每个文件的显式条目
#     match   : 上游文件名匹配，* 通配，! 前缀排除，| 分隔多条件
#     type    : 文件类型（deb|ipk|gz|zip|tar.gz|tar.xz|none），兼作后缀校验
# ====================================================================

release_repo: ""

binaries:
  - name: mosdns
    repo: yyysuo/mosdns
    verify: none
    assets:
      - match: mosdns-linux-amd64*
        type: zip
      - match: mosdns-linux-amd64-v3*
        type: zip

  - name: smartdns
    repo: pymumu/smartdns
    verify: none
    assets:
      - match: '*x86_64-debian*'
        type: deb
      - match: '*x86_64-linux*'
        type: tar.gz

  - name: sing-box
    repo: SagerNet/sing-box
    verify: none
    assets:
      - match: '*linux*amd64.deb'
        type: deb
      - match: '*linux*amd64.tar.gz|!*glibc*|!*musl*'
        type: tar.gz
      - match: '*linux*amd64-glibc*'
        type: tar.gz
      - match: '*linux*amd64-musl*'
        type: tar.gz

  - name: sing-box-releases
    repo: reF1nd/sing-box-releases
    verify: none
    assets:
      - match: '*amd64*'
        type: deb
      - match: '*linux*amd64-glibc*'
        type: tar.gz
      - match: '*linux*amd64-musl*'
        type: tar.gz

  - name: mihomo
    repo: MetaCubeX/mihomo
    verify: none
    assets:
      - match: 'mihomo-linux-amd64-v1-v*'
        type: gz
      - match: 'mihomo-linux-amd64-v1-v*'
        type: deb
      - match: 'mihomo-linux-amd64-v2-v*'
        type: gz
      - match: 'mihomo-linux-amd64-v2-v*'
        type: deb
      - match: 'mihomo-linux-amd64-v3-v*'
        type: gz
      - match: 'mihomo-linux-amd64-v3-v*'
        type: deb

  - name: adguardhome
    repo: AdguardTeam/AdGuardHome
    verify: none
    assets:
      - match: '*linux*amd64*'
        type: tar.gz

  - name: dae
    repo: daeuniverse/dae
    verify: none
    assets:
      - match: '*linux-x86_64*'
        type: deb
      - match: '*linux-x86_64*'
        type: tar.xz

  - name: xray
    repo: XTLS/Xray-core
    verify: none
    assets:
      - match: '*linux-64*'
        type: zip

  - name: routeros
    repo: elseif/MikroTikPatch
    verify: none
    assets:
      - match: 'chr-*.vmdk.zip|!*legacy-bios*'
        type: zip
      - match: 'chr-*legacy-bios*.vmdk.zip'
        type: zip

  - name: rtp2httpd
    repo: stackia/rtp2httpd
    verify: none
    assets:
      - match: '*x86_64|!*freebsd*|!*macos*|!*r1*'
        type: none
